<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Manga</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Manga" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>📚 Update Manga</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="list">หน้าแรก</button>
      <button class="tab-btn" data-tab="catalog">เรื่องทั้งหมด</button>
    </nav>
    <div class="topbar-actions">
      <button class="tab-btn icon-btn admin-only" data-tab="settings" title="ตั้งค่า" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="6" r="2" fill="currentColor"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="12" r="2" fill="currentColor"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="18" r="2" fill="currentColor"/></svg>
      </button>
      <button id="refreshAllBtn" class="icon-btn admin-only" title="รีเฟรชทั้งหมด" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 12a9 9 0 1 1-2.64-6.36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a href="/logout" class="icon-btn" title="ออกจากระบบ">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section id="listView" class="view active">
      <div id="statusBar" class="status-bar" hidden></div>
      <div id="mangaGrid" class="manga-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        ยังไม่ได้ติดตามเรื่องไหนเลย ไปที่แท็บ "เรื่องทั้งหมด" เพื่อเลือกเรื่องที่อยากติดตาม
      </div>
    </section>

    <section id="catalogView" class="view">
      <div class="chapter-search-bar" style="padding:0; background:none; border:none; margin-bottom:16px;">
        <input type="text" id="catalogSearch" placeholder="ค้นหาชื่อเรื่อง..." />
        <div class="catalog-sort-row">
          <select id="catalogSort">
            <option value="name-asc">ชื่อ ก-ฮ / A-Z</option>
            <option value="name-desc">ชื่อ ฮ-ก / Z-A</option>
            <option value="updated">วันอัพเดตล่าสุด</option>
          </select>
        </div>
      </div>
      <div id="catalogGrid" class="manga-grid"></div>
      <div id="catalogEmpty" class="empty-state" hidden>ยังไม่มีเรื่องในระบบเลย</div>
    </section>

    <section id="settingsView" class="view">
      <nav class="sub-tabs">
        <button class="sub-tab-btn active" data-subtab="mangaManage">จัดการเรื่อง</button>
        <button class="sub-tab-btn" data-subtab="userManage">จัดการสมาชิก</button>
      </nav>

      <div id="mangaManageSubview" class="subview active">
        <button id="openAddMangaBtn" class="btn primary">+ เพิ่มเรื่องใหม่</button>
        <ul id="settingsList" class="settings-list"></ul>
      </div>

      <div id="userManageSubview" class="subview">
        <form id="addUserForm" class="add-form">
          <input type="text" id="newUsername" placeholder="ชื่อผู้ใช้" required />
          <input type="password" id="newPassword" placeholder="รหัสผ่าน" required />
          <label class="checkbox-label"><input type="checkbox" id="newIsAdmin" /> เป็น admin</label>
          <button type="submit" class="btn primary">เพิ่มสมาชิก</button>
        </form>
        <div id="addUserMsg" class="form-msg"></div>
        <ul id="userList" class="settings-list"></ul>
      </div>
    </section>
  </main>

  <div id="mangaFormModal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="mangaFormTitle">เพิ่มเรื่องใหม่</h2>
      <form id="mangaForm">
        <input type="text" id="mangaFormName" placeholder="ชื่อเรื่อง" required />
        <div class="form-label">แหล่งที่มา (ดึงตอนล่าสุดจากทุกเว็บที่ใส่ไว้ เว็บไหนมีตอนใหม่กว่าใช้เว็บนั้น)</div>
        <div id="mangaFormSources" class="source-list"></div>
        <button type="button" id="addSourceRowBtn" class="btn">+ เพิ่มแหล่งที่มา</button>
        <div id="mangaFormMsg" class="form-msg"></div>
        <div class="modal-actions">
          <button type="button" id="mangaFormCancel" class="btn">ยกเลิก</button>
          <button type="submit" class="btn primary">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <div id="chapterListView" class="reader" hidden>
    <div class="reader-topbar">
      <button id="chapterListClose" class="btn">✕ ปิด</button>
      <div class="reader-title">
        <span id="chapterListMangaName"></span>
      </div>
    </div>
    <div class="chapter-search-bar">
      <input type="text" id="chapterSearch" inputmode="numeric" placeholder="ค้นหาเลขตอน..." />
    </div>
    <div id="chapterListBody" class="chapter-list-body"></div>
  </div>

  <div id="reader" class="reader" hidden>
    <div id="readerTopbar" class="reader-topbar">
      <button id="readerClose" class="icon-btn" title="กลับไปเลือกตอน">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="reader-title">
        <span id="readerMangaName"></span>
      </div>
    </div>
    <div id="readerBody" class="reader-body"></div>
    <div id="readerBottombar" class="reader-bottombar">
      <span id="readerChapterName" class="reader-chapter"></span>
      <div class="reader-nav">
        <button id="readerPrev" class="icon-btn" disabled title="ตอนก่อนหน้า">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="readerNext" class="icon-btn" disabled title="ตอนถัดไป">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
