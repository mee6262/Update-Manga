<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - MeeManga</title>
  <meta name="theme-color" content="#0f1115" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || "dark";
      document.addEventListener("DOMContentLoaded", function () {
        var c = getComputedStyle(document.documentElement).getPropertyValue("--bg-elevated").trim();
        if (c) document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
      });
    })();
  </script>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>📚 MeeManga</h1>
      <nav class="auth-tabs">
        <a href="/login" class="auth-tab{% if mode == 'login' %} active{% endif %}">เข้าสู่ระบบ</a>
        {% if registration_open %}<a href="/register" class="auth-tab{% if mode == 'register' %} active{% endif %}">สมัครสมาชิก</a>{% endif %}
      </nav>
      {% if error %}<div class="form-msg error">{{ error }}</div>{% endif %}
      {% if mode == 'register' %}
      <form class="auth-form" method="POST" action="/register">
        <input type="text" name="username" placeholder="Username" value="{{ form.username or '' }}" autocomplete="username"
               autocapitalize="none" spellcheck="false" minlength="3" maxlength="20" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,19}"
               title="3-20 ตัว ใช้ได้เฉพาะ a-z, 0-9, _ . -" required autofocus />
        <input type="email" name="email" placeholder="E-Mail" value="{{ form.email or '' }}" autocomplete="email" autocapitalize="none" required />
        <input type="password" name="password" placeholder="Password (อย่างน้อย 8 ตัว)" autocomplete="new-password" minlength="8" required />
        <input type="password" name="confirm" placeholder="Confirm Password" autocomplete="new-password" minlength="8" required />
        <button type="submit" class="btn primary">สมัครสมาชิก</button>
      </form>
      {% else %}
      <form class="auth-form" method="POST">
        <input type="text" name="username" placeholder="ชื่อผู้ใช้" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required />
        <input type="password" name="password" placeholder="รหัสผ่าน" autocomplete="current-password" required />
        <button type="submit" class="btn primary">เข้าสู่ระบบ</button>
      </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
