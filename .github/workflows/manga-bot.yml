name: Manga Auto Update Bot

on:
  schedule:
    # Run every 2 hours (minute 0 of every 2rd hour) — times are UTC
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ ท่าเดิมของมี่คือถูกต้องที่สุด! แก้ปัญหา libasound2t64 บน Ubuntu 24.04 ได้จริง
      - name: Install System Dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 libxss1
          sudo ln -s /usr/lib/x86_64-linux-gnu/libasound.so.2 /usr/lib/x86_64-linux-gnu/libasound2 || true

      # 🚀 ติดตั้ง Python packages และ Playwright browser (แบบไม่ใช้ --with-deps)
      - name: Install Python Packages and Playwright Browser
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Execute script and check updates
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # 🤝 ระบบจัดการ Git — ดึงข้อมูลผสานก่อน Push
      - name: Commit and update current status
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f manga_db.json ]; then
            git add manga_db.json
            if ! git diff --staged --quiet; then
              git commit -m "🤖 อัปเดตฐานข้อมูลตอนล่าสุด [Automated]"
              git pull --rebase -X theirs origin ${{ github.ref_name }}
              git push origin ${{ github.ref_name }}
            else
              echo "ℹ️ ไม่มีการเปลี่ยนแปลง ไม่ต้อง commit"
            fi
          fi
