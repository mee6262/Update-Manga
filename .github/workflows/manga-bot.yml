name: Manga Auto Update Bot

on:
  schedule:
    - cron: '0 0,12 * * *' # รันทุก 07:00 น. และ 19:00 น. เวลาไทย
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ จัดการติดตั้งแพ็คเกจระบบพื้นฐานด้วยตัวเอง เพื่อรองรับ Ubuntu เวอร์ชันใหม่
      # และสร้างทางเชื่อม (Symlink) ให้ระบบมองเห็น libasound2 เพื่อหลอกบอทตัวเก่า
      - name: Install System Dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 libxss1
          sudo ln -s /usr/lib/x86_64-linux-gnu/libasound.so.2 /usr/lib/x86_64-linux-gnu/libasound2 || true

      # 🚀 สั่งติดตั้งเฉพาะเบราว์เซอร์เท่านั้น ตัดคำว่า --with-deps ออกไปเพื่อไม่ให้ระบบพัง
      - name: Install Python Packages and Playwright Browser
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Execute script and check updates
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and update current status
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f manga_db.json ]; then
            git add manga_db.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 อัปเดตฐานข้อมูลตอนล่าสุด [Automated]" && git push)
          fi
