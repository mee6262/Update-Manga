name: Manga Auto Update Bot

on:
  schedule:
    - cron: '0 0,12 * * *' # รันทุก 07:00 น. และ 19:00 น. เวลาไทย
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # 🚀 อัปเดตเป็น v4.1.7+ หรือ v4 ตัวล่าสุดเพื่อบังคับใช้ Node 24 อัตโนมัติ
      - name: Check out repo code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 🚀 อัปเดตเป็น v5.1.1+ หรือ v5 ตัวล่าสุดเพื่อเคลียร์ปัญหา Node 20 ล้าสมัย
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ลดขั้นตอนที่ซ้ำซ้อนและปล่อยให้ Playwright จัดการติดตั้งแบบระบุเวอร์ชันโดยตรง
      - name: Install Dependencies and Playwright
        run: |
          pip install -r requirements.txt
          pip install --upgrade playwright
          playwright install chromium --with-deps

      # 🔍 เปิดโหมดสืบสวน: บังคับให้ Python พ่นรายงานความผิดพลาดแบบละเอียดยิบ (Unbuffered Output)
      - name: Execute script and check updates
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # ป้องกันการพังกรณีระบุตัวตน Git บนระบบ
      - name: Commit and update current status
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f manga_db.json ]; then
            git add manga_db.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 อัปเดตฐานข้อมูลตอนล่าสุด [Automated]" && git push)
          fi
